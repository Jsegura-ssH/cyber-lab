<title>Ingresos Isabel</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: una columna para celular, 4 pestañas fijas abajo (Hoy, Pensionistas, Ventas, Resumen); formularios en hoja inferior */
:root{
  --bg:#f3f5f8;--surface:#ffffff;--fg:#151b26;--muted:#596273;--line:#dde1e8;
  --accent:#3340d9;--accent-fg:#ffffff;--accent-soft:#e8eafc;
  --debt:#b4531a;--debt-bg:#fdeee3;--ok:#1c7c4d;--ok-bg:#e1f4ea;--crit:#c0392b;
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;--body:"Inter",ui-sans-serif,system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1118;--surface:#171b25;--fg:#e8ebf2;--muted:#98a2b5;--line:#272d3b;
  --accent:#8c9bff;--accent-fg:#0b0f24;--accent-soft:#222849;
  --debt:#f0a36b;--debt-bg:#3a2415;--ok:#58d195;--ok-bg:#12301f;--crit:#ff8a7a;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1118;--surface:#171b25;--fg:#e8ebf2;--muted:#98a2b5;--line:#272d3b;
  --accent:#8c9bff;--accent-fg:#0b0f24;--accent-soft:#222849;
  --debt:#f0a36b;--debt-bg:#3a2415;--ok:#58d195;--ok-bg:#12301f;--crit:#ff8a7a;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45}
.wrap{max-width:640px;margin:0 auto;padding-block:18px 110px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
h1{font-family:var(--display);font-weight:800;font-size:1.7rem;margin:0;letter-spacing:-.01em}
h2{font-family:var(--display);font-weight:600;font-size:1.1rem;margin:0}
.sub{color:var(--muted);font-size:.85rem}
.role{display:inline-block;font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border-radius:99px;border:1px solid var(--line);color:var(--muted)}
#app{display:flex;flex-direction:column;gap:12px;min-width:0}
input,select,textarea{font:inherit;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;min-width:0}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px}
.ctrls{display:grid;grid-template-columns:1fr;gap:8px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font:inherit;font-size:.88rem;padding:8px 14px;border-radius:99px;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.sumbar{display:flex;gap:14px;flex-wrap:wrap;font-size:.88rem;color:var(--muted)}
.sumbar b{color:var(--fg);font-variant-numeric:tabular-nums}
.person{display:flex;flex-direction:column;gap:8px}
.prow{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.pname{font-weight:600;overflow-wrap:anywhere}
.ctrs{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}
.ctr{display:flex;align-items:center;justify-content:space-between;gap:4px;min-width:0;background:var(--bg);border-radius:10px;padding:6px}
.ctr .lbl{font-size:.72rem;color:var(--muted);line-height:1.15;flex:1 1 auto;min-width:0;overflow-wrap:anywhere}
.ctr .n{font-family:var(--display);font-weight:800;font-size:1.25rem;min-width:1.4em;text-align:center;font-variant-numeric:tabular-nums}
.cb{flex:none;width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--fg);font-size:1.3rem;font-weight:600;cursor:pointer;line-height:1}
.cb.plus{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.tag{font-size:.74rem;padding:2px 8px;border-radius:99px;background:var(--bg);color:var(--muted);white-space:nowrap}
.tag.debt{background:var(--debt-bg);color:var(--debt)}
.tag.ok{background:var(--ok-bg);color:var(--ok)}
.num{font-variant-numeric:tabular-nums}
.btn{font:inherit;font-size:.9rem;font-weight:500;padding:10px 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.danger{color:var(--crit);border-color:var(--crit)}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:22px;text-align:center;color:var(--muted)}
.list{display:flex;flex-direction:column;gap:8px}
.lrow{display:flex;justify-content:space-between;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;cursor:pointer;text-align:left;font:inherit;color:var(--fg);width:100%}
.lrow.static{cursor:default}
.big{font-family:var(--display);font-weight:800;font-size:2rem;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.kv{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.kv:last-child{border-bottom:0}
.kv span:last-child{font-variant-numeric:tabular-nums;font-weight:600}
.kv.sub2 span:first-child{color:var(--muted);padding-left:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--bg);border-radius:10px;padding:8px 10px;display:flex;flex-direction:column;gap:2px}
.stat small{color:var(--muted);font-size:.72rem}
.stat b{font-variant-numeric:tabular-nums;font-size:.98rem}
.bar{height:8px;border-radius:99px;background:var(--bg);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--accent)}
.bar i.best{background:var(--ok)}
.bar i.worst{background:var(--debt)}
.drow{display:flex;flex-direction:column;gap:4px;padding:8px 0;border-bottom:1px solid var(--line)}
.drow:last-child{border-bottom:0}
#nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);z-index:10}
#nav button{font:inherit;font-size:.72rem;font-weight:500;background:none;border:0;color:var(--muted);padding:12px 4px;cursor:pointer}
#nav button[aria-current="page"]{color:var(--accent);font-weight:600;box-shadow:inset 0 2px 0 var(--accent)}
.sheet-bg{position:fixed;inset:0;background:rgb(0 0 0 / .45);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet{background:var(--surface);width:100%;max-width:640px;border-radius:16px 16px 0 0;padding:18px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px;max-height:92vh;overflow:auto}
.field{display:flex;flex-direction:column;gap:4px;font-size:.85rem;color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.note{font-size:.85rem;color:var(--muted)}
.err{color:var(--crit);font-size:.85rem}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:99px;font-size:.88rem;z-index:30;max-width:90vw}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(20px);opacity:.6}}}
</style>

<div class="wrap">
  <header>
    <h1>Ingresos Isabel</h1>
    <div class="sub"><span class="role">Administrador</span> <span id="status"></span></div>
  </header>
  <main id="app"><div class="empty">Cargando…</div></main>
</div>
<nav id="nav" hidden>
  <button data-tab="hoy">Hoy</button>
  <button data-tab="pens">Pensionistas</button>
  <button data-tab="ventas">Ventas</button>
  <button data-tab="caja">Caja</button>
  <button data-tab="resumen">Resumen</button>
</nav>
<div id="sheetRoot"></div>
<div id="toast" hidden></div>

<script>
const PL=10, PT=11; // precio plato: en local / para llevar
const MEALS=[["d","Desayuno"],["a","Almuerzo"],["c","Cena"]];
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const r2=n=>Math.round((n||0)*100)/100;
const money=n=>"S/ "+r2(n).toFixed(2);
const ds=(d=new Date())=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const fmt=d=>d?d.slice(8,10)+"/"+d.slice(5,7)+"/"+d.slice(0,4):"";
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36);
const clone=o=>JSON.parse(JSON.stringify(o));
const mealName=k=>(MEALS.find(m=>m[0]===k)||[,k])[1];
const defMeal=()=>{const h=new Date().getHours();return h<11?"d":h<17?"a":"c";};

let db=null, isAdmin=false, loaded=0;
const S={pens:{},comidas:{},pagos:{},ventas:{},cajas:{},prods:{},extras:{}};
const ui={tab:"hoy",date:ds(),meal:defMeal(),q:"",q2:"",vDate:ds(),rp:"hoy",rf:"",rt:"",cv:null,vMeal:defMeal(),vMethod:"efectivo",cDate:ds(),cd:{},mode:"platos"};

// ---------- Escritura en cola (una a la vez por documento) ----------
const queues={};
function enqueue(key,fn){
  queues[key]=(queues[key]||Promise.resolve()).then(fn).catch(()=>{toast("No se pudo guardar. Revisa tu conexión.");});
  return queues[key];
}
let toastT;
function toast(msg){const t=$("#toast");t.textContent=msg;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>{t.hidden=true;},3500);}

// ---------- Cálculos ----------
function cell(pid,date,meal){const d=S.comidas[date.slice(0,7)+"_"+pid];return(d&&d.days&&d.days[date]&&d.days[date][meal])||{l:0,t:0,v:0};}
function calc(){
  const per={};
  for(const id in S.pens)per[id]={l:0,t:0,v:0,x:0,xq:0,paid:0};
  for(const doc of Object.values(S.comidas)){const p=per[doc.pid];if(!p)continue;
    for(const cells of Object.values(doc.days||{}))for(const c of Object.values(cells)){p.l+=c.l||0;p.t+=c.t||0;p.v+=c.v||0;}}
  for(const doc of Object.values(S.extras)){const p=per[doc.pid];if(!p)continue;for(const items of Object.values(doc.days||{}))for(const c of Object.values(items)){p.xq+=c.q||0;p.x+=c.v||0;p.v+=c.v||0;}}
  for(const g of Object.values(S.pagos)){const p=per[g.pid];if(p)p.paid+=g.amount||0;}
  return per;
}
function consumoRango(pid,from,to){
  const out={l:0,t:0,v:0,days:[]};
  for(const doc of Object.values(S.comidas)){if(doc.pid!==pid)continue;
    for(const [d,cells] of Object.entries(doc.days||{})){if((from&&d<from)||(to&&d>to))continue;
      let any=false;
      for(const c of Object.values(cells)){out.l+=c.l||0;out.t+=c.t||0;out.v+=c.v||0;if(c.l||c.t)any=true;}
      if(any)out.days.push({d,cells});}}
  out.days.sort((a,b)=>b.d.localeCompare(a.d));
  return out;
}
function extrasRango(pid,from,to){
  const out={q:0,v:0,days:[]};
  for(const doc of Object.values(S.extras)){if(doc.pid!==pid)continue;
    for(const [d,items] of Object.entries(doc.days||{})){if((from&&d<from)||(to&&d>to))continue;
      let any=false;for(const c of Object.values(items)){out.q+=c.q||0;out.v+=c.v||0;if(c.q)any=true;}
      if(any)out.days.push({d,items});}}
  out.days.sort((a,b)=>b.d.localeCompare(a.d));return out;
}
const prodName=id=>(S.prods[id]&&S.prods[id].name)||"Producto";
function rango(){
  const t=ds();
  if(ui.rp==="hoy")return[t,t];
  if(ui.rp==="mes")return[t.slice(0,7)+"-01",t.slice(0,7)+"-31"];
  if(ui.rp==="ant"){const n=new Date();const m=ds(new Date(n.getFullYear(),n.getMonth()-1,1)).slice(0,7);return[m+"-01",m+"-31"];}
  return[ui.rf||"0000-00-00",ui.rt||"9999-99-99"];
}
function resumen(from,to){
  const r={pen:{e:0,y:0},menu:{e:0,y:0},prod:{e:0,y:0},pl:0,pt:0,consumo:0,px:0};
  for(const g of Object.values(S.pagos)){if(g.date<from||g.date>to)continue;r.pen[g.method==="yape"?"y":"e"]+=g.amount||0;}
  for(const [date,doc] of Object.entries(S.ventas)){if(date<from||date>to)continue;
    for(const e of Object.values(doc.entries||{})){if(e.void)continue;r[e.tipo==="prod"?"prod":"menu"][e.method==="yape"?"y":"e"]+=(e.qty||0)*(e.price||0);}}
  for(const doc of Object.values(S.comidas))for(const [d,cells] of Object.entries(doc.days||{})){if(d<from||d>to)continue;
    for(const c of Object.values(cells)){r.pl+=c.l||0;r.pt+=c.t||0;r.consumo+=c.v||0;}}
  for(const doc of Object.values(S.extras))for(const [d,items] of Object.entries(doc.days||{})){if(d<from||d>to)continue;for(const c of Object.values(items)){r.px+=c.v||0;r.consumo+=c.v||0;}}
  return r;
}
const tot=o=>o.e+o.y;

// ---------- Vistas ----------
function viewHoy(per){
  const q=ui.q.trim().toLowerCase();
  const all=Object.entries(S.pens).filter(([,p])=>p.active!==false).map(([id,p])=>({id,...p})).sort((a,b)=>a.name.localeCompare(b.name,"es"));
  let tl=0,tt=0,tv=0;
  for(const p of all){const c=cell(p.id,ui.date,ui.meal);tl+=c.l;tt+=c.t;tv+=c.v;}
  const shown=all.filter(p=>p.name.toLowerCase().includes(q));
  let h=`${modeChips()}<div class="ctrls">
    <input id="hoy-date" type="date" value="${esc(ui.date)}" max="${esc(ds())}" aria-label="Fecha">
    <div class="chips" role="group" aria-label="Comida">${MEALS.map(m=>`<button class="chip" data-a="meal" data-k="${m[0]}" aria-pressed="${ui.meal===m[0]}">${m[1]}</button>`).join("")}</div>
    <input id="q" type="search" placeholder="Buscar pensionista…" value="${esc(ui.q)}" aria-label="Buscar pensionista">
  </div>
  <div class="sumbar"><span>${mealName(ui.meal)} ${ui.date===ds()?"de hoy":fmt(ui.date)}:</span><span><b>${tl}</b> en local</span><span><b>${tt}</b> para llevar</span><span><b>${money(tv)}</b></span></div>`;
  if(!all.length){
    return h+`<div class="empty">Aún no hay pensionistas.<br>Agrégalos en la pestaña <b>Pensionistas</b> (puedes pegar varios nombres a la vez).<div class="btns" style="justify-content:center;margin-top:12px"><button class="btn primary" data-a="addpens">+ Agregar pensionistas</button></div></div>`;
  }
  h+=`<div class="list">`;
  for(const p of shown){
    const c=cell(p.id,ui.date,ui.meal),pp=per[p.id]||{v:0,paid:0},debe=r2(pp.v-pp.paid);
    h+=`<div class="card person"><div class="prow"><span class="pname">${esc(p.name)}</span>${debe>0?`<span class="tag debt">Debe ${money(debe)}</span>`:`<span class="tag ok">Al día</span>`}</div>
      <div class="ctrs">
        <div class="ctr"><span class="lbl">En local<br>${money(PL)}</span><button class="cb" data-a="bump" data-id="${esc(p.id)}" data-k="l" data-d="-1" aria-label="Quitar plato en local">−</button><span class="n">${c.l}</span><button class="cb plus" data-a="bump" data-id="${esc(p.id)}" data-k="l" data-d="1" aria-label="Agregar plato en local">+</button></div>
        <div class="ctr"><span class="lbl">Para llevar<br>${money(PT)}</span><button class="cb" data-a="bump" data-id="${esc(p.id)}" data-k="t" data-d="-1" aria-label="Quitar plato para llevar">−</button><span class="n">${c.t}</span><button class="cb plus" data-a="bump" data-id="${esc(p.id)}" data-k="t" data-d="1" aria-label="Agregar plato para llevar">+</button></div>
      </div></div>`;
  }
  if(!shown.length)h+=`<div class="empty">No hay ningún pensionista con «${esc(ui.q)}».<div class="btns" style="justify-content:center;margin-top:10px"><button class="btn primary" data-a="quickadd">Agregar «${esc(ui.q.trim())}»</button></div></div>`;
  return h+`</div>`;
}

function viewPens(per){
  const q=ui.q2.trim().toLowerCase();
  const rows=Object.entries(S.pens).map(([id,p])=>({id,...p,...(per[id]||{l:0,t:0,v:0,paid:0})}))
    .filter(p=>p.name.toLowerCase().includes(q))
    .sort((a,b)=>((b.active!==false)-(a.active!==false))||(r2(b.v-b.paid)-r2(a.v-a.paid))||a.name.localeCompare(b.name,"es"));
  let h=`<div class="ctrls"><input id="q2" type="search" placeholder="Buscar pensionista…" value="${esc(ui.q2)}" aria-label="Buscar pensionista"></div>
    <div class="btns"><button class="btn primary" data-a="addpens">+ Agregar pensionistas</button></div>`;
  if(!rows.length)return h+`<div class="empty">${Object.keys(S.pens).length?"Ninguno coincide con la búsqueda.":"Aún no hay pensionistas. Toca <b>+ Agregar pensionistas</b>."}</div>`;
  const debeTot=rows.reduce((a,p)=>a+Math.max(0,r2(p.v-p.paid)),0);
  h+=`<div class="sumbar"><span>Por cobrar en total: <b>${money(debeTot)}</b></span></div><div class="list">`;
  for(const p of rows){
    const debe=r2(p.v-p.paid);
    h+=`<button class="lrow" data-a="pensdet" data-id="${esc(p.id)}" style="${p.active===false?"opacity:.55":""}"><span style="min-width:0"><span class="pname">${esc(p.name)}</span><br><span class="sub">${p.l+p.t} platos${p.active===false?" · inactivo":""}</span></span>${debe>0?`<span class="tag debt">Debe ${money(debe)}</span>`:debe<0?`<span class="tag ok">A favor ${money(-debe)}</span>`:`<span class="tag ok">Al día</span>`}</button>`;
  }
  return h+`</div>`;
}

function viewVentas(){
  const doc=S.ventas[ui.vDate]||{};
  const ents=Object.entries(doc.entries||{}).map(([id,e])=>({id,...e})).filter(e=>!e.void).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
  let menu=0,prod=0,ef=0,ya=0;
  for(const e of ents){const m=(e.qty||0)*(e.price||0);if(e.tipo==="prod")prod+=m;else menu+=m;if(e.method==="yape")ya+=m;else ef+=m;}
  let h=`<div class="ctrls"><input id="v-date" type="date" value="${esc(ui.vDate)}" max="${esc(ds())}" aria-label="Fecha de ventas"></div>
    <div class="card"><div class="sub" style="margin-bottom:8px">Anotar venta rápido (se guarda en la fecha de arriba)</div>
      <div class="chips" role="group" aria-label="Comida">${MEALS.map(m=>`<button class="chip" data-a="vmeal" data-k="${m[0]}" aria-pressed="${ui.vMeal===m[0]}">${m[1]}</button>`).join("")}</div>
      <div class="chips" style="margin-top:8px" role="group" aria-label="Método de pago"><button class="chip" data-a="vmeth" data-k="efectivo" aria-pressed="${ui.vMethod==="efectivo"}">Efectivo</button><button class="chip" data-a="vmeth" data-k="yape" aria-pressed="${ui.vMethod==="yape"}">Yape</button></div>
      <div class="btns" style="margin-top:10px"><button class="btn primary" data-a="quick" data-p="${PL}">Menú ${money(PL)}</button><button class="btn primary" data-a="quick" data-p="${PT}">Llevar ${money(PT)}</button></div>
      <div class="btns" style="margin-top:8px"><button class="btn primary" data-a="sell">Vender producto de la lista</button><button class="btn" data-a="addventa">Otro precio o extra</button></div></div>
    <div class="card"><div class="kv"><span>Menú</span><span>${money(menu)}</span></div><div class="kv"><span>Productos</span><span>${money(prod)}</span></div><div class="kv"><span><b>Total del día</b></span><span>${money(menu+prod)}</span></div><div class="kv sub2"><span>Efectivo</span><span>${money(ef)}</span></div><div class="kv sub2"><span>Yape</span><span>${money(ya)}</span></div></div>`;
  if(!ents.length)return h+`<div class="empty">Aún no hay ventas ${ui.vDate===ds()?"hoy":"en esta fecha"}.<br>Toca <b>+ Registrar venta</b> para anotar la primera.</div>`;
  h+=`<div class="list">`;
  for(const e of ents){
    const m=(e.qty||0)*(e.price||0);
    h+=`<div class="lrow static"><span style="min-width:0"><span class="pname">${esc(e.name||(e.tipo==="prod"?"Producto":"Menú"))}</span><br><span class="sub">${e.tipo==="prod"?"Producto":"Menú"} · ${e.qty} × ${money(e.price)} · ${e.method==="yape"?"Yape":"Efectivo"}${e.meal?" · "+mealName(e.meal):""}</span></span>

function viewDias(){
  const nom=["Domingo","Lunes","Martes","Miércoles","Jueves","Viernes","Sábado"],by={},ag=nom.map(()=>({t:0,n:0}));
  const add=(d,q)=>{by[d]=(by[d]||0)+q;};
  for(const doc of Object.values(S.comidas))for(const [d,cells] of Object.entries(doc.days||{}))for(const c of Object.values(cells))add(d,(c.l||0)+(c.t||0));
  for(const [d,doc] of Object.entries(S.ventas))for(const e of Object.values(doc.entries||{}))if(!e.void&&e.tipo!=="prod")add(d,e.qty||0);
  let total=0;
  for(const [d,q] of Object.entries(by)){if(q<=0)continue;const w=new Date(+d.slice(0,4),+d.slice(5,7)-1,+d.slice(8,10)).getDay();ag[w].t+=q;ag[w].n++;total+=q;}
  if(!total)return `<div class="card"><div class="sub">Platos en total (todo el historial)</div><div class="big">0</div><p class="note">Cuando registres platos, aquí verás qué día se vende más y cuál es el más bajo.</p></div>`;
  const rows=[1,2,3,4,5,6,0].map(w=>({w,nombre:nom[w],t:ag[w].t,n:ag[w].n,avg:ag[w].n?ag[w].t/ag[w].n:0}));
  const con=rows.filter(r=>r.n>0),max=Math.max(1,...con.map(r=>r.avg));
  let best=null,worst=null;
  if(con.length>=2){best=con.reduce((a,b)=>b.avg>a.avg?b:a);worst=con.reduce((a,b)=>b.avg<a.avg?b:a);if(best.avg===worst.avg)best=worst=null;}
  const f1=n=>(Math.round(n*10)/10).toString();
  return `<div class="card"><div class="sub">Platos en total (todo el historial)</div><div class="big">${total}</div>
    ${best?`<div class="kv"><span>Día que más se vende</span><span><span class="tag ok">${best.nombre}</span> ${f1(best.avg)} por día</span></div><div class="kv"><span>Día más bajo</span><span><span class="tag debt">${worst.nombre}</span> ${f1(worst.avg)} por día</span></div>`:`<p class="note">Cuando haya platos en más de un día de la semana, aquí verás el mejor y el más bajo.</p>`}
    <div style="margin-top:6px">${rows.map(r=>`<div class="drow"><div class="prow"><span>${r.nombre}</span><span class="sub num">${r.n?`${f1(r.avg)} por día · ${r.t} en total · ${r.n} ${r.n===1?"día":"días"}`:"sin datos"}</span></div><div class="bar"><i class="${best&&r.w===best.w?"best":worst&&r.w===worst.w?"worst":""}" style="width:${r.n?Math.max(3,Math.round(r.avg/max*100)):0}%"></i></div></div>`).join("")}</div>
    <p class="note">Cuenta los platos de pensionistas (en local y para llevar) y las ventas de menú. Se compara el promedio por día, para que un día de la semana con más fechas registradas no gane por tener más semanas.</p></div>`;
}

function cajaBloque(date,meal){
  const r={e:{menu:0,prod:0,pen:0},y:{menu:0,prod:0,pen:0},platos:0};
  const doc=S.ventas[date];
  for(const e of Object.values((doc&&doc.entries)||{})){
    if(e.void||(e.meal||"")!==meal)continue;
    r[e.method==="yape"?"y":"e"][e.tipo==="prod"?"prod":"menu"]+=(e.qty||0)*(e.price||0);
  }
  for(const g of Object.values(S.pagos)){
    if(g.date!==date||(g.meal||"")!==meal)continue;
    r[g.method==="yape"?"y":"e"].pen+=g.amount||0;
  }
  if(meal)for(const d of Object.values(S.comidas)){const c=d.days&&d.days[date]&&d.days[date][meal];if(c)r.platos+=(c.l||0)+(c.t||0);}
  return r;
}
const sm=o=>o.menu+o.prod+o.pen;
function dtag(d){d=r2(d);return d===0?`<span class="tag ok">Cuadra</span>`:d>0?`<span class="tag ok">Sobra ${money(d)}</span>`:`<span class="tag debt">Falta ${money(-d)}</span>`;}
function viewCaja(){
  const date=ui.cDate,caja=S.cajas[date]||{};
  const saved=(m,k)=>{const v=(caja[m]||{})[k];return v==null?null:v;};
  const val=(m,k)=>{const key=date+"|"+m+"|"+k;if(key in ui.cd)return ui.cd[key];const v=saved(m,k);return v==null?"":v;};
  let totEe=0,totEy=0,cntE=0,cntY=0,expE=0,expY=0,hasE=false,hasY=false,cards="";
  for(const m of [...MEALS.map(x=>x[0]),""]){
    const r=cajaBloque(date,m),ee=sm(r.e),ey=sm(r.y);
    totEe+=ee;totEy+=ey;
    if(!m){
      if(ee||ey)cards+=`<div class="card"><h2>Sin comida asignada</h2><div class="kv"><span>Efectivo</span><span>${money(ee)}</span></div><div class="kv"><span>Yape</span><span>${money(ey)}</span></div><p class="note">Son ventas o cobros anotados antes de elegir la comida. Entran en el total del día.</p></div>`;
      continue;
    }
    const ce=saved(m,"e"),cy=saved(m,"y");
    if(ce!=null){cntE+=ce;expE+=ee;hasE=true;}
    if(cy!=null){cntY+=cy;expY+=ey;hasY=true;}
    cards+=`<div class="card"><h2>${mealName(m)}</h2>
      <div class="kv"><span>Menú (efectivo)</span><span>${money(r.e.menu)}</span></div>
      <div class="kv"><span>Productos (efectivo)</span><span>${money(r.e.prod)}</span></div>
      <div class="kv"><span>Cobros de pensionistas (efectivo)</span><span>${money(r.e.pen)}</span></div>
      <div class="kv"><span><b>Efectivo esperado</b></span><span>${money(ee)}</span></div>
      <label class="field" style="margin-top:8px">Efectivo contado (S/)<input type="number" min="0" step="0.01" inputmode="decimal" id="cj-${m}-e" data-cj="${date}|${m}|e" value="${esc(val(m,"e"))}"></label>
      ${ce!=null?`<div class="kv"><span>Resultado en efectivo</span><span>${dtag(ce-ee)}</span></div>`:""}
      <div class="kv" style="margin-top:6px"><span><b>Yape esperado</b></span><span>${money(ey)}</span></div>
      <label class="field">Yape recibido, según tu celular (S/)<input type="number" min="0" step="0.01" inputmode="decimal" id="cj-${m}-y" data-cj="${date}|${m}|y" value="${esc(val(m,"y"))}"></label>
      ${cy!=null?`<div class="kv"><span>Resultado en Yape</span><span>${dtag(cy-ey)}</span></div>`:""}

      <div class="kv"><span>Efectivo esperado</span><span>${money(totEe)}</span></div>
      <div class="kv"><span>Yape esperado</span><span>${money(totEy)}</span></div>
      ${hasE?`<div class="kv"><span>Efectivo contado</span><span>${money(cntE)}</span></div><div class="kv"><span>Resultado en efectivo</span><span>${dtag(cntE-expE)}</span></div>`:""}
      ${hasY?`<div class="kv"><span>Yape recibido</span><span>${money(cntY)}</span></div><div class="kv"><span>Resultado en Yape</span><span>${dtag(cntY-expY)}</span></div>`:""}
      <p class="note">El resultado compara solo las comidas donde escribiste lo contado. Si empiezas con sencillo en la caja, réstalo antes de escribir el efectivo contado.</p></div>`;
}
function saveCaja(el){
  const key=el.dataset.cj,[date,meal,k]=key.split("|"),raw=el.value.trim(),val=raw===""?null:r2(+raw);
  if(val!==null&&!(val>=0)){toast("Escribe un monto válido.");return;}
  delete ui.cd[key];
  const doc=S.cajas[date]||(S.cajas[date]={});
  doc[meal]={...(doc[meal]||{}),[k]:val};
  render();
  enqueue("j"+date,async()=>{
    const patch={[meal]:{[k]:val}};
    try{await db.doc("cajas/"+date).update(patch);}
    catch(x){if(x&&x.code==="invalid_argument")await db.doc("cajas/"+date).set(patch);else throw x;}
  });
}

function modeChips(){return `<div class="chips" role="group" aria-label="Qué anotar"><button class="chip" data-a="mode" data-k="platos" aria-pressed="${ui.mode==="platos"}">Platos</button><button class="chip" data-a="mode" data-k="prod" aria-pressed="${ui.mode==="prod"}">Productos (gaseosa, galleta…)</button></div>`;}
function xcell(pid,date,prodId){const d=S.extras[date.slice(0,7)+"_"+pid];return(d&&d.days&&d.days[date]&&d.days[date][prodId])||{q:0,v:0};}
function viewHoyProd(per){
  const q=ui.q.trim().toLowerCase();
  const prods=Object.entries(S.prods).filter(([,p])=>p.active!==false).map(([id,p])=>({id,...p})).sort((a,b)=>a.name.localeCompare(b.name,"es"));
  const all=Object.entries(S.pens).filter(([,p])=>p.active!==false).map(([id,p])=>({id,...p})).sort((a,b)=>a.name.localeCompare(b.name,"es"));
  let tq=0,tv=0;

    <div class="btns"><button class="btn" data-a="prods">Administrar productos y precios</button></div>`;
  if(!prods.length)return h+`<div class="empty">Todavía no hay productos.<br>Agrega los que venden a los pensionistas (gaseosa, galleta…) con su precio.<div class="btns" style="justify-content:center;margin-top:12px"><button class="btn primary" data-a="prods">+ Agregar productos</button></div></div>`;
  if(!all.length)return h+`<div class="empty">Aún no hay pensionistas. Agrégalos en la pestaña <b>Pensionistas</b>.</div>`;
  const shown=all.filter(p=>p.name.toLowerCase().includes(q));

  for(const p of shown){

    const hoy=Object.entries(S.prods).map(([id,x])=>({x,c:xcell(p.id,ui.date,id)})).filter(t=>t.c.q);

}

function prodRow(x,n,add,sub){return `<div class="lrow static" style="padding:0;overflow:hidden;gap:0;min-height:68px"><button type="button" ${add}="${esc(x.id)}" style="flex:1;min-width:0;text-align:left;font:inherit;font-size:1.05rem;color:var(--fg);background:${n?"var(--accent-soft)":"none"};border:0;padding:16px 12px;cursor:pointer;align-self:stretch"><b>${esc(x.name)}</b><br><span class="sub">${money(x.price)}</span></button>${n?`<span style="font-family:var(--display);font-weight:800;font-size:1.5rem;padding:0 12px">${n}</span><button type="button" class="cb" ${sub}="${esc(x.id)}" aria-label="Quitar ${esc(x.name)}" style="width:56px;height:56px;margin-right:8px;font-size:1.7rem">−</button>`:""}</div>`;}
function setStep(f,boxId,b){f.querySelectorAll("#"+boxId+" [data-st]").forEach(x=>x.setAttribute("aria-pressed",x===b));}

function bumpVp(prodId,delta){
  const pr=S.prods[prodId];if(!pr)return;
  const date=ui.vDate,eid=["q",prodId,ui.vMeal,ui.vMethod].join("_");
  const doc=S.ventas[date]||(S.ventas[date]={date,entries:{}});
  doc.entries=doc.entries||{};
  const cur=doc.entries[eid],live=cur&&!cur.void,q0=live?(cur.qty||0):0;
  if(delta<0&&!q0)return;
  const q=q0+delta;
  const entry=q>0?{tipo:"prod",name:pr.name,qty:q,price:live?(cur.price||pr.price):pr.price,method:ui.vMethod,meal:ui.vMeal,createdAt:live?(cur.createdAt||Date.now()):Date.now(),void:false}:{void:true};
  doc.entries[eid]=q>0?entry:{...cur,void:true};
  render();
  enqueue("v"+date,async()=>{
    try{await db.doc("ventas/"+date).update({entries:{[eid]:entry}});}
    catch(x){if(x&&x.code==="invalid_argument")await db.doc("ventas/"+date).set({date,entries:{[eid]:entry}});else throw x;}
  });
}

    f.onsubmit=e=>{e.preventDefault();closeSheet();};

function bumpx(pid,prodId,delta){
  const pr=S.prods[prodId];if(!pr)return;
  const date=ui.date,month=date.slice(0,7),id=month+"_"+pid;
  const doc=S.extras[id]||(S.extras[id]={pid,month,days:{}});
  doc.days=doc.days||{};const day=doc.days[date]||(doc.days[date]={});
  const c={q:0,v:0,...(day[prodId]||{})};
  if(delta<0&&!c.q)return;
  if(delta<0)delta=-Math.min(-delta,c.q);
  c.q+=delta;c.v=Math.max(0,r2(c.v+delta*(pr.price||0)));if(!c.q)c.v=0;
  day[prodId]=c;render();
  const payload={days:{[date]:{[prodId]:{...c}}}};
  enqueue("x"+id,async()=>{
    try{await db.doc("extras/"+id).update(payload);}
    catch(e){if(e&&e.code==="invalid_argument")await db.doc("extras/"+id).set({pid,month,...payload});else throw e;}
  });
}
function addProd(name,price){const id=uid(),p={name,price:r2(price),active:true,createdAt:Date.now()};S.prods[id]=p;render();enqueue("r"+id,()=>db.doc("productos/"+id).set(p));}
function patchProd(id,patch){Object.assign(S.prods[id],patch);render();enqueue("r"+id,()=>db.doc("productos/"+id).update(patch));}
function prodSheet(){

      <div class="grid2" style="margin-top:6px"><label class="field">Precio (S/)<input type="number" min="0.01" step="0.01" inputmode="decimal" id="pp-${esc(p.id)}" value="${esc(p.price)}"></label>
      <div class="btns" style="align-self:end"><button class="btn" type="button" data-ps="${esc(p.id)}">Guardar</button><button class="btn" type="button" data-pa="${esc(p.id)}">${p.active===false?"Activar":"Archivar"}</button></div></div></div>`).join("")}

    f.querySelectorAll("[data-pa]").forEach(b=>b.onclick=()=>{const p=S.prods[b.dataset.pa];patchProd(b.dataset.pa,{active:p.active===false});prodSheet();});

// ---------- Render ----------
function render(){
  if(!isAdmin||!db)return;
  const a=document.activeElement,fid=a&&a.id&&$("#app").contains(a)?a.id:null,ss=fid&&a.selectionStart,se=fid&&a.selectionEnd;
  const per=calc();
  $("#app").innerHTML=loaded<7?`<div class="empty">Cargando datos…</div>`:ui.tab==="hoy"?(ui.mode==="prod"?viewHoyProd(per):viewHoy(per)):ui.tab==="pens"?viewPens(per):ui.tab==="ventas"?viewVentas():ui.tab==="caja"?viewCaja():viewResumen(per);
  document.querySelectorAll("#nav button").forEach(b=>b.setAttribute("aria-current",b.dataset.tab===ui.tab?"page":"false"));
  if(fid){const el=document.getElementById(fid);if(el){el.focus();try{el.setSelectionRange(ss,se);}catch(e){}}}
}

// ---------- Acciones de datos ----------
function bump(pid,k,delta){
  const date=ui.date,meal=ui.meal,month=date.slice(0,7),id=month+"_"+pid;
  const doc=S.comidas[id]||(S.comidas[id]={pid,month,days:{}});
  doc.days=doc.days||{};
  const day=doc.days[date]||(doc.days[date]={});
  const c={l:0,t:0,v:0,...(day[meal]||{})};
  if(delta<0&&!c[k])return;
  c[k]+=delta;c.v=Math.max(0,r2(c.v+delta*(k==="l"?PL:PT)));if(!c.l&&!c.t)c.v=0;
  day[meal]=c;render();
  const payload={days:{[date]:{[meal]:{...c}}}};
  enqueue("c"+id,async()=>{
    try{await db.doc("comidas/"+id).update(payload);}
    catch(e){if(e&&e.code==="invalid_argument")await db.doc("comidas/"+id).set({pid,month,...payload});else throw e;}
  });
}
function addVenta(date,e){
  const id=uid(),entry={...e,createdAt:Date.now()};
  const doc=S.ventas[date]||(S.ventas[date]={date,entries:{}});
  doc.entries=doc.entries||{};doc.entries[id]=entry;render();
  enqueue("v"+date,async()=>{
    try{await db.doc("ventas/"+date).update({entries:{[id]:entry}});}
    catch(x){if(x&&x.code==="invalid_argument")await db.doc("ventas/"+date).set({date,entries:{[id]:entry}});else throw x;}
  });
}
function voidVenta(date,id){
  const doc=S.ventas[date];if(!doc||!doc.entries||!doc.entries[id])return;
  doc.entries[id].void=true;ui.cv=null;render();
  enqueue("v"+date,()=>db.doc("ventas/"+date).update({entries:{[id]:{void:true}}}));
}
function addPens(names){
  const list=[...new Set(names.map(n=>n.trim()).filter(Boolean))];
  const known=new Set(Object.values(S.pens).map(p=>p.name.toLowerCase()));
  const nuevos=list.filter(n=>!known.has(n.toLowerCase()));
  for(const name of nuevos){
    const id=uid(),p={name,active:true,createdAt:Date.now()};
    S.pens[id]=p;
    enqueue("p"+id,()=>db.doc("pensionistas/"+id).set(p));
  }
  render();
  return {added:nuevos.length,skipped:list.length-nuevos.length};
}
function addPago(pid,amount,method,date,meal){
  const id=uid(),g={pid,amount:r2(amount),method,date,meal,createdAt:Date.now()};
  S.pagos[id]=g;render();
  enqueue("g"+id,()=>db.doc("pagos/"+id).set(g));
}
function delPago(id){delete S.pagos[id];render();enqueue("g"+id,()=>db.doc("pagos/"+id).delete());}
function patchPens(id,patch){Object.assign(S.pens[id],patch);render();enqueue("p"+id,()=>db.doc("pensionistas/"+id).update(patch));}

  const pp=calc()[pid]||{l:0,t:0,v:0,paid:0},saldo=r2(pp.v-pp.paid),cr=consumoRango(pid,from,to),ex=extrasRango(pid,from,to);

// ---------- Eventos ----------
document.addEventListener("click",e=>{
  const nb=e.target.closest("#nav [data-tab]");
  if(nb){ui.tab=nb.dataset.tab;ui.cv=null;render();window.scrollTo(0,0);return;}
  const b=e.target.closest("#app [data-a]");if(!b)return;
  const a=b.dataset.a;
  if(a==="meal"){ui.meal=b.dataset.k;render();}
  else if(a==="bump")bump(b.dataset.id,b.dataset.k,+b.dataset.d);
  else if(a==="addpens")addPensSheet();
  else if(a==="quickadd")addPensSheet(ui.q.trim());
  else if(a==="pensdet")pensSheet(b.dataset.id);
  else if(a==="addventa")ventaSheet();
  else if(a==="voidask"){ui.cv=b.dataset.id;render();}
  else if(a==="voidyes")voidVenta(ui.vDate,b.dataset.id);
  else if(a==="rp"){ui.rp=b.dataset.k;render();}
  else if(a==="mode"){ui.mode=b.dataset.k;render();}
  else if(a==="bumpx")bumpx(b.dataset.id,b.dataset.p,+b.dataset.d);
  else if(a==="prods")prodSheet();
  else if(a==="pick")pickSheet(b.dataset.id);
  else if(a==="sell")sellSheet();
  else if(a==="vmeal"){ui.vMeal=b.dataset.k;render();}
  else if(a==="vmeth"){ui.vMethod=b.dataset.k;render();}
  else if(a==="quick"){const p=+b.dataset.p;addVenta(ui.vDate,{tipo:"menu",name:"",qty:1,price:p,method:ui.vMethod,meal:ui.vMeal});toast("Anotado: "+money(p)+" · "+mealName(ui.vMeal)+" · "+(ui.vMethod==="yape"?"Yape":"Efectivo"));}
});
document.addEventListener("input",e=>{
  if(e.target.id==="q"){ui.q=e.target.value;render();}
  else if(e.target.id==="q2"){ui.q2=e.target.value;render();}
  else if(e.target.dataset&&e.target.dataset.cj){ui.cd[e.target.dataset.cj]=e.target.value;}
});
document.addEventListener("change",e=>{
  const id=e.target.id;
  if(id==="hoy-date"&&e.target.value){ui.date=e.target.value;render();}
  else if(id==="v-date"&&e.target.value){ui.vDate=e.target.value;ui.cv=null;render();}
  else if(id==="r-from"){ui.rf=e.target.value;render();}
  else if(id==="r-to"){ui.rt=e.target.value;render();}
  else if(id==="c-date"&&e.target.value){ui.cDate=e.target.value;ui.cd={};render();}
  else if(e.target.dataset&&e.target.dataset.cj)saveCaja(e.target);
});

// ---------- Arranque ----------
(async()=>{
  const user=await claude.use("user");
  isAdmin=!!(user&&await user.canEdit());
  db=await claude.use("db");
  if(!isAdmin||!db){
    $("#app").innerHTML=`<div class="empty">${!db?"Inicia sesión en Claude para usar esta página.":"Esta página es solo para administradores."}</div>`;
    $(".role").textContent="Sin acceso";return;
  }
  $("#nav").hidden=false;render();
  const timer=setTimeout(()=>{$("#status").textContent="· Sin conexión, los datos pueden estar desactualizados";},10000);
  const seen={};
  const sub=(col,key)=>db.collection(col).onSnapshot(snap=>{
    S[key]={};snap.docs.forEach(d=>{S[key][d.id]=clone(d.data());});
    if(!seen[key]){seen[key]=1;loaded++;}
    if(!snap.metadata.fromCache){clearTimeout(timer);$("#status").textContent="· En vivo";}
    render();
  },()=>{clearTimeout(timer);$("#status").textContent="· No se pudo cargar";});
  sub("pensionistas","pens");sub("comidas","comidas");sub("pagos","pagos");sub("ventas","ventas");sub("cajas","cajas");sub("productos","prods");sub("extras","extras");
})();
